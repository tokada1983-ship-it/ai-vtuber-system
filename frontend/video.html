<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AI Vtuber - Video Avatar</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  /* 透過WebMを2枚重ね、切り替え時にクロスフェードして継ぎ目を消す */
  .stage { position: relative; width: 100%; height: 100%; }
  .stage video {
    position: absolute; inset: 0; margin: auto;
    height: 100%; width: 100%;
    object-fit: contain;
    opacity: 0; transition: opacity 0.25s linear;
  }
  .stage video.active { opacity: 1; }
  #status-indicator {
    position: absolute; left: 8px; bottom: 6px;
    color: rgba(255,255,255,0.55); font-size: 11px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    pointer-events: none; user-select: none;
  }
  #notice {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: #fff; font-size: 15px; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8); padding: 1em;
  }

  /* ── 演出エフェクト（カットイン・フリップ） ─────────────── */
  #cutin {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: transparent;
    opacity: 0; pointer-events: none; transition: opacity 0.15s linear; z-index: 5;
  }
  #cutin.visible { opacity: 1; }
  #flip {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; z-index: 6; pointer-events: none;
  }
  #flip.visible { display: flex; }
  #flip-board {
    background: #fff; color: #222; border: 6px solid #333; border-radius: 18px;
    padding: 28px 44px; max-width: 86%; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    transform: rotate(-2deg);
  }
  #flip-label { font-size: 20px; font-weight: bold; color: #c0392b; margin-bottom: 6px; }
  #flip-text { font-size: 54px; font-weight: 900; line-height: 1.25; letter-spacing: 0.02em; }

  /* ── 内心（声に出さない心の声。小さい吹き出しで弱く出す） ── */
  #thought {
    position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%);
    display: none; max-width: 72%; z-index: 4; pointer-events: none;
  }
  #thought.visible { display: block; }
  #thought-bubble {
    position: relative;
    background: rgba(255,255,255,0.88); color: #555;
    border: 2px solid rgba(130,130,130,0.55); border-radius: 16px;
    padding: 8px 18px; font-size: 17px; font-style: italic; line-height: 1.45;
    text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  /* 吹き出しの「…」のしっぽ（小さい丸2つ）で内心らしさを出す */
  #thought-bubble::before,
  #thought-bubble::after {
    content: ''; position: absolute; left: 50%; border-radius: 50%;
    background: rgba(255,255,255,0.88); border: 2px solid rgba(130,130,130,0.55);
  }
  #thought-bubble::before { bottom: -13px; margin-left: -4px; width: 9px; height: 9px; }
  #thought-bubble::after { bottom: -24px; margin-left: -2px; width: 5px; height: 5px; }
  #thought-speaker { font-style: normal; font-weight: bold; font-size: 13px; color: #888; margin-right: 0.5em; }
</style>
</head>
<body>
<div class="stage">
  <video id="vA" muted playsinline preload="auto"></video>
  <video id="vB" muted playsinline preload="auto"></video>
</div>
<div id="notice"></div>
<div id="status-indicator">video avatar</div>
<video id="cutin" muted playsinline preload="auto"></video>
<div id="flip"><div id="flip-board"><div id="flip-label"></div><div id="flip-text"></div></div></div>
<div id="thought"><div id="thought-bubble"><span id="thought-speaker"></span><span id="thought-text"></span></div></div>

<audio id="voice"></audio>

<script>
'use strict';
// ────────────────────────────────────────────────────────────────
// 動画アバター: 透過WebMのモーション動画を再生する画面
//   待機モーション … カタログの idle を順番にループ再生（クロスフェード）
//   アクションモーション … 発話に合わせて1回だけ再生し、終わったら待機へ戻る
//     （チャンネル動画と同じ「アクションは1回だけ、残りは待機」の流儀）
// ────────────────────────────────────────────────────────────────

const MUTED = new URLSearchParams(location.search).get('mute') === '1';
const CHAR_PARAM = new URLSearchParams(location.search).get('char') || '';
let MY_CHAR = CHAR_PARAM;

let cfg = { idle: [], motion_map: {}, emotion_map: {} };
// 待機モーションは shuffle-bag 方式: シャッフルした袋から順に取り出し、
// 袋が尽きたら入れ直す。同じモーションが偏って繰り返されない
let idleBag = [];
let lastIdleUrl = '';
let mode = 'idle';            // 'idle' | 'action'
let pendingAction = null;     // アクション再生中に来た次のアクション（最新1つだけ保持）
let lastEmotion = 'neutral';

const els = [document.getElementById('vA'), document.getElementById('vB')];
let front = 0;                // 表示中レイヤーの index
const voice = document.getElementById('voice');

// ── ヘルスチェック（ハートビート／再生ウォッチドッグ／エラー転送） ──
// 2026-11-19 の配信テストで「WS は connected 表示のまま再生だけ凍結」し、
// 外部から生死判定できなかった反省から入れた仕組み。
// 再生の進行を数えてバックエンドへ送り続け、止まったら自分で回復を試み、
// 起きたことは WS 経由でバックエンドのログに残す。
const health = {
  frames: 0,               // 実際に表示されたフレーム数（requestVideoFrameCallback）
  progressSec: 0,          // currentTime が進んだ累計秒（フレーム数の代替指標）
  lastTime: -1,            // フロント動画の前回 currentTime
  lastProgressAt: performance.now(),  // currentTime が最後に進んだ時刻
  lastWsAt: 0,             // 最後に WS メッセージを受信した時刻
  ws: null,
  currentClip: '',         // 再生中クリップの URL（swapTo で更新）
  stallCount: 0,           // 同一クリップでの連続回復試行回数
  rvfc: typeof document.getElementById('vA').requestVideoFrameCallback === 'function',
};
function healthFrames() {
  return (health.rvfc && health.frames > 0) ? health.frames : Math.round(health.progressSec);
}
let statusBase = 'video avatar';
function renderStatus() {
  const age = health.lastWsAt ? Math.round((performance.now() - health.lastWsAt) / 1000) + 's' : '-';
  document.getElementById('status-indicator').textContent =
    statusBase + ' · f:' + healthFrames() + ' ws:' + age;
}
function setStatus(msg) { statusBase = msg; renderStatus(); }

// 表示フレーム数の計測（実際に提示されたフレームだけを数える）
if (health.rvfc) {
  const countFrames = (el) => {
    el.requestVideoFrameCallback(() => { health.frames++; countFrames(el); });
  };
  els.forEach(countFrames);
}

function sendToHub(obj) {
  try {
    if (health.ws && health.ws.readyState === WebSocket.OPEN) health.ws.send(JSON.stringify(obj));
  } catch (e) { /* 送れなくてもページ自体は止めない */ }
}
const _eventSentAt = {};
function sendPageEvent(event, detail) {
  const now = performance.now();
  if (_eventSentAt[event] && now - _eventSentAt[event] < 5000) return;  // 同種は5秒に1回まで
  _eventSentAt[event] = now;
  sendToHub({ type: 'page_event', character: MY_CHAR, page: 'video', event: event,
              detail: String(detail || '').slice(0, 300) });
}
window.addEventListener('error', (e) => {
  sendPageEvent('page_error', (e.message || 'error') + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
});
window.addEventListener('unhandledrejection', (e) => {
  sendPageEvent('page_error', 'unhandledrejection: ' + ((e.reason && e.reason.message) || e.reason || ''));
});

function clipName(url) { return url ? String(url).split('/').pop() : ''; }

// メディアイベントのテレメトリ（デコード停滞・読込失敗を黙らせない）
els.forEach((el, idx) => {
  el.addEventListener('error', () => {
    const err = el.error ? 'code=' + el.error.code : '';
    sendPageEvent('media_error', 'el=' + idx + ' clip=' + clipName(el.getAttribute('src') || '') + ' ' + err);
    if (idx === front) skipStalledClip('media_error');
  });
  for (const ev of ['stalled', 'waiting']) {
    el.addEventListener(ev, () => {
      if (idx !== front) return;
      const clipAtEvent = health.currentClip;
      const timeAtEvent = el.currentTime || 0;
      setTimeout(() => {
        // 切替直後の一瞬の waiting は正常系。3秒後も詰まっている場合だけ知らせる
        if (idx !== front || health.currentClip !== clipAtEvent) return;
        if (el.readyState >= 3 && (el.currentTime || 0) > timeAtEvent + 0.1) return;
        sendPageEvent('media_' + ev, 'clip=' + clipName(clipAtEvent) +
          ' readyState=' + el.readyState + ' networkState=' + el.networkState);
      }, 3000);
    });
  }
});

// ── 再生ウォッチドッグ ────────────────────────────────────────
// フロントの <video> は「再生中のはずなのに currentTime が進まない」状態になると
// ended も error も発火せず永久に止まる（2026-11-19 の凍結の型）。
// 進行を見張り、段階的に回復する：再開 → 同じクリップ再読込 → 次のクリップへ。
// それでも短時間に繰り返すならページ自体を再読込する（多重リロード防止つき）。
const STALL_SEC = 6;
const _stallEpisodes = [];

function skipStalledClip(reason) {
  sendPageEvent('playback_stall', reason + ' clip=' + clipName(health.currentClip));
  const now = Date.now();
  _stallEpisodes.push(now);
  while (_stallEpisodes.length && now - _stallEpisodes[0] > 10 * 60 * 1000) _stallEpisodes.shift();
  health.stallCount = 0;
  health.lastProgressAt = performance.now();
  if (_stallEpisodes.length >= 3) {
    const last = +(sessionStorage.getItem('aivtWatchdogReload') || 0);
    if (now - last > 10 * 60 * 1000) {
      sessionStorage.setItem('aivtWatchdogReload', String(now));
      sendPageEvent('watchdog_reload', 'stall episodes=' + _stallEpisodes.length);
      setTimeout(() => location.reload(), 300);
      return;
    }
  }
  onClipEnded();   // 通常の「次のクリップへ」と同じ経路で進める
}

function recoverStall(el, stallSec) {
  health.stallCount++;
  sendPageEvent('playback_stall',
    'try=' + health.stallCount + ' clip=' + clipName(health.currentClip) +
    ' stall=' + stallSec.toFixed(0) + 's readyState=' + el.readyState +
    ' networkState=' + el.networkState + ' paused=' + el.paused);
  health.lastProgressAt = performance.now();   // 次の判定まで猶予を与える
  if (health.stallCount === 1) {
    const p = el.play(); if (p) p.catch(() => {});
  } else if (health.stallCount === 2) {
    if (health.currentClip) { el.src = health.currentClip; el.load(); }
    const p = el.play(); if (p) p.catch(() => {});
  } else {
    skipStalledClip('unrecoverable');
  }
}

setInterval(() => {
  renderStatus();
  const el = els[front];
  if (!el || !health.currentClip) return;
  const now = performance.now();
  const ct = el.currentTime || 0;
  const delta = ct - health.lastTime;
  if (health.lastTime >= 0 && delta > 0.03 && delta < 1.5) {
    health.progressSec += delta;
    health.lastTime = ct;
    health.lastProgressAt = now;
    health.stallCount = 0;
  } else if (health.lastTime < 0) {
    health.lastTime = ct;
  }
  const stallSec = (now - health.lastProgressAt) / 1000;
  if (el.ended) {
    // ended イベントを取りこぼすと末尾フレームで止まり続ける。通常は起きない保険
    if (stallSec > 4) { health.lastProgressAt = now; onClipEnded(); }
    return;
  }
  if (stallSec > STALL_SEC) recoverStall(el, stallSec);
}, 1000);

// ハートビート：3秒ごとに「生きていて、再生が進んでいる」ことを送る
setInterval(() => {
  const el = els[front];
  sendToHub({
    type: 'heartbeat', character: MY_CHAR, page: 'video',
    frames: healthFrames(),
    state_time: el ? +(el.currentTime || 0).toFixed(2) : 0,
    ready_state: el ? el.readyState : 0,
    clip: clipName(health.currentClip), mode: mode,
    context_lost: false,
  });
}, 3000);
function showNotice(msg) {
  const n = document.getElementById('notice');
  n.textContent = msg || '';
  n.style.display = msg ? 'flex' : 'none';
}
function isMine(msg) {
  if (!MY_CHAR) return true;
  if (msg.type === 'config_update') return !msg.characters || msg.characters.includes(MY_CHAR);
  return !msg.character || msg.character === MY_CHAR;
}
function avatarConfigUrl() {
  return '/api/avatar_config' + (CHAR_PARAM ? '?char=' + encodeURIComponent(CHAR_PARAM) : '');
}
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

// ── 再生ステートマシン ──────────────────────────────────────────
function swapTo(url, { loop = false } = {}) {
  const cur = els[front];
  const nxt = els[1 - front];
  nxt.loop = loop;
  nxt.src = url;
  nxt.currentTime = 0;
  health.currentClip = url;
  health.lastTime = -1;
  health.lastProgressAt = performance.now();
  const p = nxt.play();
  if (p) p.catch((err) => {
    sendPageEvent('play_rejected', 'clip=' + clipName(url) + ' ' + ((err && err.name) || err));
  });
  nxt.classList.add('active');
  cur.classList.remove('active');
  // 裏になった方は少し遅らせて止める（クロスフェードの残像を残さない）
  setTimeout(() => { try { cur.pause(); } catch (e) {} }, 300);
  front = 1 - front;
  els[front].onended = onClipEnded;
  // 切替直後の開始失敗への早期リカバリ（2026-11-21 分析E）：
  // 実配信の停滞10件が全て「切替直後・paused=true・readyState=4・再生位置ほぼ0」
  // だったため、6秒ウォッチドッグを待たず、切替1.2秒後に同条件なら play を
  // 1回だけ打ち直す。正常な切替では paused=false か再生位置が進むため発火しない。
  const startedEl = els[front];
  setTimeout(() => {
    if (health.currentClip !== url || els[front] !== startedEl) return;
    if (startedEl.paused && !startedEl.ended && startedEl.readyState >= 2 &&
        (startedEl.currentTime || 0) < 0.05) {
      sendPageEvent('early_replay', 'clip=' + clipName(url) +
        ' readyState=' + startedEl.readyState + ' networkState=' + startedEl.networkState);
      const rp = startedEl.play(); if (rp) rp.catch(() => {});
    }
  }, 1200);
}

function nextIdleUrl() {
  if (idleBag.length === 0) {
    idleBag = cfg.idle.slice();
    for (let i = idleBag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = idleBag[i]; idleBag[i] = idleBag[j]; idleBag[j] = t;
    }
    // 入れ直した直後の先頭が、直前に再生したものと同じなら入れ替えて
    // 袋の境界での連続再生を避ける
    if (idleBag.length > 1 && idleBag[0] === lastIdleUrl) {
      const t = idleBag[0]; idleBag[0] = idleBag[1]; idleBag[1] = t;
    }
  }
  const url = idleBag.shift();
  lastIdleUrl = url;
  return url;
}

function playIdle() {
  if (!cfg.idle.length) { showNotice('待機モーションがありません（カタログを確認してください）'); return; }
  mode = 'idle';
  swapTo(nextIdleUrl(), { loop: false });   // 終了イベントで次の待機へ回すため loop は使わない
}

function playAction(urls) {
  if (!urls || !urls.length) return;
  if (mode === 'action') { pendingAction = urls; return; }
  mode = 'action';
  swapTo(pick(urls), { loop: false });
}

function onClipEnded() {
  if (mode === 'action') {
    if (pendingAction) {
      const next = pendingAction; pendingAction = null;
      mode = 'idle';               // playAction が再度 action にする
      playAction(next);
      return;
    }
    playIdle();
    return;
  }
  playIdle();                      // 待機は次のバリエーションへ
}

// ── モーション解決 ──────────────────────────────────────────────
function handleMotion(motion, emotion) {
  const name = motion || 'idle';
  if (name === 'none') return;
  if (name !== 'idle' && cfg.motion_map[name]) { playAction(cfg.motion_map[name]); return; }
  // motion が idle/未対応でも、感情に合う動きがあればそちらを出す
  const emo = emotion || lastEmotion;
  if (emo && emo !== 'neutral' && cfg.emotion_map[emo]) playAction(cfg.emotion_map[emo]);
}

// ── 音声（バックエンド側で鳴らしているときは ?mute=1） ─────────
function playAudio(url) {
  if (MUTED || !url) return;
  voice.src = url;
  voice.play().catch(() => {});
}

// ── WebSocket ───────────────────────────────────────────────────

// ── 演出エフェクト（カットイン・フリップ。効果音はアプリ側で鳴る） ──
const cutinEl = document.getElementById('cutin');
const flipEl = document.getElementById('flip');
const flipLabel = document.getElementById('flip-label');
const flipText = document.getElementById('flip-text');
let flipTimer = null;

function showCutin(url) {
  if (!url) return;
  cutinEl.src = url;
  cutinEl.classList.add('visible');
  const p = cutinEl.play();
  if (p) p.catch(() => hideCutin());
}
function hideCutin() {
  cutinEl.classList.remove('visible');
  try { cutinEl.pause(); } catch (e) {}
  cutinEl.removeAttribute('src');
  cutinEl.load();
}
cutinEl.addEventListener('ended', hideCutin);
cutinEl.addEventListener('error', hideCutin);

function showFlip(msg) {
  flipLabel.textContent = msg.speaker || msg.label || '';
  flipLabel.style.display = flipLabel.textContent ? 'block' : 'none';
  flipText.textContent = msg.text || '';
  flipEl.classList.add('visible');
  clearTimeout(flipTimer);
  const sec = Math.min(15, Math.max(1, msg.duration_sec || 5));
  flipTimer = setTimeout(() => flipEl.classList.remove('visible'), sec * 1000);
}

function handleEffect(msg) {
  if (msg.effect_type === 'cutin') showCutin(msg.url);
  else if (msg.effect_type === 'flip') showFlip(msg);
  // se はアプリ側の音声出力で鳴るので画面では何もしない
}

// ── 内心（声に出さない心の声を、小さい吹き出しで表示する） ────
const thoughtEl = document.getElementById('thought');
const thoughtSpeaker = document.getElementById('thought-speaker');
const thoughtText = document.getElementById('thought-text');
let thoughtTimer = null;

function showThought(msg) {
  thoughtSpeaker.textContent = msg.speaker || '';
  thoughtSpeaker.style.display = thoughtSpeaker.textContent ? 'inline' : 'none';
  thoughtText.textContent = msg.text || '';
  thoughtEl.classList.add('visible');
  clearTimeout(thoughtTimer);
  // 表示時間は字幕と同じ方式（約5文字/秒＋余韻、2.5〜14秒）
  const ms = Math.min(14000, Math.max(2500, (msg.text || '').length * 200 + 800));
  thoughtTimer = setTimeout(() => thoughtEl.classList.remove('visible'), ms);
}

function connectWS() {
  const ws = new WebSocket(`ws://${location.host}/ws/avatar`);
  health.ws = ws;
  ws.onopen = () => setStatus('connected');
  ws.onclose = () => { setStatus('disconnected'); setTimeout(connectWS, 3000); };
  ws.onmessage = (e) => {
    health.lastWsAt = performance.now();
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    if (!isMine(msg)) return;

    if (msg.type === 'config_update') {
      if (msg.avatar_type && msg.avatar_type !== 'video' && location.pathname === '/avatar') {
        location.reload();
        return;
      }
      if (msg.video) { applyVideoConfig(msg.video); }
    }
    if (msg.type === 'effect') handleEffect(msg);
    if (msg.type === 'thought') showThought(msg);
    if (msg.type === 'test_motion') handleMotion(msg.motion || 'wave', 'happy');
    if (msg.type === 'speech_start') {
      lastEmotion = msg.emotion || 'neutral';
      if (msg.audio_url) playAudio(msg.audio_url);
    }
    if (msg.type === 'motion') handleMotion(msg.motion || 'idle', lastEmotion);
    if (msg.type === 'speech_end') { lastEmotion = 'neutral'; }
  };
}

function applyVideoConfig(video) {
  const newIdle = video.idle || [];
  if (JSON.stringify(newIdle) !== JSON.stringify(cfg.idle)) idleBag = [];
  cfg = {
    idle: newIdle,
    motion_map: video.motion_map || {},
    emotion_map: video.emotion_map || {},
  };
  if (!video.catalog_ok) {
    showNotice('動画カタログが見つかりません: ' + (video.catalog_path || '(未設定)'));
    return;
  }
  showNotice('');
  if (mode === 'idle' && !els[front].src) playIdle();
}

// ── 起動 ────────────────────────────────────────────────────────
(async function init() {
  try {
    const data = await (await fetch(avatarConfigUrl())).json();
    if (data.character) MY_CHAR = data.character;
    setStatus('video avatar: ' + (data.character_name || MY_CHAR || ''));
    applyVideoConfig(data.video || {});
    if (cfg.idle.length) playIdle();
  } catch (e) {
    showNotice('アバター設定の取得に失敗しました');
  }
  connectWS();
})();
</script>
</body>
</html>
