<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ローカルチャット - AI Vtuber</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3e;
    --accent: #7c6ff7; --accent2: #4fc3f7;
    --green: #4caf50; --red: #f44336; --yellow: #ffca28;
    --text: #e0e0e0; --muted: #6b7280;
    --font: 'Segoe UI','Hiragino Sans',sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px;
    display: flex; flex-direction: column;
  }

  header {
    padding: 10px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; color: var(--accent); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
  .dot.alive { background: var(--green); }
  #mode { font-size: 12px; color: var(--muted); flex: 1; min-width: 160px; }

  button {
    padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  button:hover { opacity: .82; }
  button:disabled { opacity: .4; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost   { background: var(--border); color: var(--text); }
  .btn-danger  { background: var(--red); color: #fff; }

  #log {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { display: flex; flex-direction: column; max-width: min(680px, 82%); }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .msg .body {
    padding: 9px 13px; border-radius: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .body { background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .msg.assistant .body { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.system { align-self: center; max-width: 90%; }
  .msg.system .body {
    background: transparent; color: var(--muted); font-size: 12px;
    border: 1px dashed var(--border); padding: 5px 10px;
  }
  .msg.system.error .body { color: var(--red); border-color: var(--red); }

  #thinking { color: var(--muted); font-size: 12px; padding: 0 16px 6px; height: 18px; }
  #memory-bar {
    padding: 5px 16px; font-size: 11px; color: var(--muted);
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .divider {
    align-self: center; font-size: 11px; color: var(--muted);
    padding: 2px 10px; border: 1px dashed var(--border); border-radius: 10px;
  }

  footer {
    padding: 10px 16px 14px; background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; min-height: 42px; max-height: 160px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 12px; font-family: var(--font); font-size: 14px; line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--muted); padding: 0 16px 8px; }
</style>
</head>
<body>

<header>
  <div class="dot" id="dot"></div>
  <h1>ローカルチャット</h1>
  <span id="mode">接続中...</span>
  <button class="btn-primary" id="start-btn" onclick="startChat()">▶ 開始</button>
  <button class="btn-danger"  id="stop-btn"  onclick="stopChat()">■ 停止</button>
  <button class="btn-ghost" onclick="rememberNow()" title="いまの会話を長期記憶へ整理する">🧠 いま覚える</button>
  <button class="btn-ghost" onclick="clearLog()">🧹 表示をクリア</button>
  <button class="btn-ghost" onclick="deleteHistory()" title="保存された会話ログを削除する">🗑 履歴を削除</button>
  <a href="/" target="_blank"><button class="btn-ghost">⚙️ ダッシュボード</button></a>
</header>
<div id="memory-bar"></div>

<div id="log"></div>
<div id="thinking"></div>

<footer>
  <textarea id="input" rows="1" placeholder="メッセージを入力（Enterで送信 / Shift+Enterで改行）"
            onkeydown="onKey(event)" oninput="autoGrow(this)"></textarea>
  <button class="btn-primary" onclick="send()">送信</button>
</footer>
<div class="hint">
  ローカルテストモードです。配信サイトには接続せず、この画面の入力とマイク入力だけに応答します。
  会話はキャラクターごとに保存され、次に開いたときも続きから話せます。
</div>

<script>
// ── WebSocket ────────────────────────────────────────────────
let ws = null;
let status = null;
let historyLoaded = false;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws/chat`);
  ws.onopen = () => {
    document.getElementById('dot').classList.add('alive');
    wsSend('chat_ping', {});
    if (!historyLoaded) loadHistory();
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'chat') {
      addMessage(msg.role, msg.text, msg.author || msg.character);
      if (msg.role === 'assistant') setThinking(false);
    } else if (msg.type === 'chat_status') {
      applyStatus(msg);
    } else if (msg.type === 'chat_error') {
      addMessage('system', msg.error, null, true);
      setThinking(false);
    } else if (msg.type === 'chat_history_cleared') {
      clearLog();
      addMessage('system', `保存された会話ログを削除しました（${msg.removed}件）`);
    } else if (msg.type === 'chat_remembered') {
      addMessage('system', msg.ok
        ? `会話を長期記憶へ整理しました（新規 ${msg.added} 件）`
        : '整理する会話がありませんでした');
    }
  };
  ws.onclose = () => {
    document.getElementById('dot').classList.remove('alive');
    setTimeout(connect, 2000);
  };
}

function wsSend(cmd, data = {}) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ cmd, ...data }));
}

// ── 表示 ─────────────────────────────────────────────────────

function applyStatus(st) {
  status = st;
  const el = document.getElementById('mode');
  if (!st.running) {
    el.textContent = '停止中 — 送信すると自動でローカルモードを開始します';
  } else if (st.is_local_chat) {
    const many = (st.characters || []).length > 1;
    el.textContent = `${st.character} と${many ? '' : '1対1'}チャット（LLM: ${st.llm_backend} / TTS: ${st.tts_backend}）`;
  } else {
    el.textContent = `別モードで動作中: ${st.mode}（停止してから開始してください）`;
  }
  document.getElementById('start-btn').disabled = st.running && st.is_local_chat;
  document.getElementById('stop-btn').disabled  = !st.running;

  const bar = document.getElementById('memory-bar');
  const m = st.memory || {};
  if (bar) {
    bar.textContent = m.persist_history
      ? `記憶: 会話ログ ${m.history_count || 0}件 / おぼえたこと ${m.episodic_count || 0}件`
        + `（未整理 ${m.turns_since_consolidation || 0} ターン`
        + (m.consolidate_every_turns ? ` / ${m.consolidate_every_turns}ターンごとに自動整理）` : '）')
      : `記憶: 会話ログの保存はオフ / おぼえたこと ${m.episodic_count || 0}件`;
  }
}

// ── 過去ログ ─────────────────────────────────────────────────

async function loadHistory() {
  try {
    const data = await (await fetch('/api/chat/history?limit=100')).json();
    if (data.status) applyStatus(data.status);
    const items = data.items || [];
    if (!items.length) { historyLoaded = true; return; }
    items.forEach(it => addMessage(it.role === 'partner' ? 'assistant' : it.role,
                                   it.text, it.author, false, true));
    addDivider('ここから今回の会話');
    historyLoaded = true;
  } catch (e) {
    console.warn('history load failed', e);
  }
}

function addDivider(text) {
  const log = document.getElementById('log');
  const d = document.createElement('div');
  d.className = 'divider';
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function deleteHistory() {
  if (!confirm('保存された会話ログを削除します。よろしいですか？\n（おぼえた記憶は消えません）')) return;
  wsSend('chat_history_clear', {});
}

function rememberNow() {
  wsSend('chat_remember', {});
  addMessage('system', '会話を整理しています...');
}

function addMessage(role, text, author, isError, isPast) {
  if (!text) return;
  const log = document.getElementById('log');
  const last = log.lastElementChild;

  // キャラの発話は文ごとに届くので、連続する発話は1つの吹き出しにまとめる
  // （過去ログは1件ずつ保存されているのでまとめない）
  if (!isPast && role === 'assistant' && last && last.classList.contains('assistant')
      && !last.dataset.past && (last.dataset.author || '') === (author || '')) {
    last.querySelector('.body').textContent += text;
    log.scrollTop = log.scrollHeight;
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role + (isError ? ' error' : '');
  if (author) wrap.dataset.author = author;
  if (isPast) {
    wrap.dataset.past = '1';
    wrap.style.opacity = '.65';    // 前回までの会話は少し薄く表示する
  }
  if (role !== 'system') {
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'user'
      ? (author || (status && status.user_name) || 'あなた')
      : author || (status && status.character) || 'AI';
    wrap.appendChild(who);
  }
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;          // 受け取った文字列はHTMLとして解釈させない
  wrap.appendChild(body);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function setThinking(on) {
  document.getElementById('thinking').textContent = on ? '考え中...' : '';
}

function clearLog() {
  document.getElementById('log').textContent = '';
}

// 表示だけ消したあとに過去ログを読み直したいとき用
function reloadHistory() {
  clearLog();
  historyLoaded = false;
  loadHistory();
}

// ── 操作 ─────────────────────────────────────────────────────

function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  wsSend('chat_send', { message: text });
  input.value = '';
  autoGrow(input);
  setThinking(true);
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function startChat() {
  wsSend('chat_start', {});
  addMessage('system', 'ローカルチャットモードを開始しました');
}

function stopChat() {
  wsSend('chat_stop', {});
  addMessage('system', '停止しました');
  setThinking(false);
}

connect();
setInterval(() => wsSend('chat_ping', {}), 5000);
</script>
</body>
</html>
