      text: ''
      label: キラキラ
    drumroll:
      file: assets/effects/se/drumroll.wav
      text: ''
      label: ドラムロール
    applause:
      file: assets/effects/se/applause.wav
      text: ''
      label: 拍手
    don:
      file: assets/effects/se/don.wav
      text: ''
      label: ドン
    chime:
      file: assets/effects/se/chime.wav
      text: ''
      label: ピンポーン
    whoosh:
      file: assets/effects/se/whoosh.wav
      text: ''
      label: 風切り
  flip:
    announcement:
      file: ''
      text: 重大発表！
      label: 重大発表
