    - 先週
    - 来週
    - 今月
    - 先月
    - 今年
    - 去年
    - 現在
    opinion_markers:
    - どう思う
    - 感想
    - 好き
    - 派？
    - 派か
    - おすすめ
    - 推し
    - 応援
    answer_retry_delays_sec:
    - 30
    - 120
    - 300
    pending_ttl_sec: 600
local_chat:
  user_name: マスター
  priority: 10.0
  idle_talk: true
  autostart: true
  greeting: ''
  persist_history: true
  history_max_entries: 1000
  restore_context_turns: 8
  consolidate_every_turns: 6
stt:
  enabled: true
  backend: faster_whisper
  model: small
  device: auto
  compute_type: ''
  language: ja
  speaker_name: マスター
  priority: 9.0
  min_duration_ms: 400
  warmup_on_start: true
persona:
  enabled: false
  adapter: ''
  backend: lmstudio
  runtime_model: your-persona-model
  prompt_mode: slim
  fallback_to_base: true
  base_model: "<YOUR_PATH>/your-base-model"
  output_dir: models/persona
  epochs: 3.0
  learning_rate: 0.0002
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  max_seq_len: 1024
  batch_size: 1
  grad_accum: 8
  llama_cpp_dir: tools/llama.cpp
  gguf_outtype: q8_0
  synthetic_samples: 200
  teacher_backend: lmstudio
  teacher_model: bartowski/qwen_qwen3.6-35b-a3b-gguf/qwen_qwen3.6-35b-a3b-q4_0.gguf
  include_chat_history: true
ollama:
  auto_start: true
  preload_on_start: true
  executable: ''
  keep_alive: 30m
  auto_pull: false
  startup_timeout_sec: 30.0
  stop_on_exit: true
# 内心（thought）表示: 発話に付随する短い内心を専用チャネルへ流す（TTSには混ぜない）
thoughts:
  enabled: true
  max_chars: 30
  cooldown_sec: 20.0
# ELYTH（AI専用SNS）の日次エピソードを対象キャラの記憶へ取り込む
# episodes_dir はエピソードファイル（ELYTH-EP-YYYYMMDD.md）のローカルコピー置き場
elyth_memory:
  enabled: true
  episodes_dir: elyth-episodes
  character: Character1
  scan_interval_sec: 3600.0
# 自発エフェクト（カットイン / SE / フリップボード）
# SE の音声ファイル等のアセットは各自で配置する（このパッケージには含まれない）
effects:
  enabled: true
  cooldown_sec: 90.0
  flip_duration_sec: 5.0
  flip_max_chars: 30
  system:
    enabled: true
    cooldown_sec: 300.0
    silence_threshold_sec: 180.0
    cutin_probability: 0.15
  cutin:
